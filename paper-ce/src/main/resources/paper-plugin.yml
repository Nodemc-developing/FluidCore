name: FluidCore
version: '${version}'
main: com.ydxc20091.fluidcore.FluidCorePlugin
api-version: '1.21'
folia-supported: true
authors: [ydxc20091]
description: Transactional fluid API and CraftEngine integration.
dependencies:
  server:
    CraftEngine:
      load: BEFORE
      required: true
      join-classpath: true
permissions:
  fluidcore.admin:
    description: Inspect and configure FluidCore.
    default: op
